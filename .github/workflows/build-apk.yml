name: Build Beckon APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Prepare APK Artifact
        run: |
          mkdir -p dist
          find android/app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} dist/beckon.apk \;
          ls -la dist/

      - name: Upload Beckon APK
        uses: actions/upload-artifact@v4
        with:
          name: beckon.apk
          path: dist/beckon.apk
          retention-days: 14
