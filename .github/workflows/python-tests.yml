name: Python Daemon Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Python ML & Daemon Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy onnxruntime jellyfish rapidfuzz websockets

      - name: Run Name Matcher & Word Confidence Tests
        run: python -m daemon.tests.test_matcher

      - name: Run Acoustic Keyword Spotting (KWS) Tests
        run: python -m daemon.tests.test_kws

      - name: Run Morpho-Phonetic Vocative Intent Tests
        run: python -m daemon.tests.test_intent_classifier

      - name: Run Pipeline End-to-End Simulation
        run: python -m eval.test_pipeline

      - name: Run Multilingual Corpus Benchmark (78 Samples)
        run: python -m eval.benchmark_intent_corpus
