<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Beckon</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 316px;
      padding: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      background: #0b0c0e;
      color: #f4f4f6;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Top bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #ffffff;
    }
    .brand-icon {
      width: 18px;
      height: 18px;
      background: #1c1e24;
      border: 1px solid #282c35;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-icon svg {
      width: 11px;
      height: 11px;
      fill: #ffffff;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 500;
      color: #8e919a;
      background: #14161c;
      border: 1px solid #232731;
      padding: 3px 9px;
      border-radius: 20px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
      transition: background 0.2s;
    }
    .status-dot.online {
      background: #10b981;
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.6);
    }

    /* Warning banner */
    .offline-banner {
      display: none;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 8px;
      padding: 9px 11px;
      font-size: 11.5px;
      color: #fca5a5;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .offline-banner code {
      font-family: ui-monospace, SFMono-Regular, monospace;
      color: #fecaca;
      background: rgba(0, 0, 0, 0.3);
      padding: 1px 4px;
      border-radius: 3px;
    }

    /* Main input area */
    .input-group {
      margin-bottom: 16px;
    }
    .input-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 8px;
      letter-spacing: -0.1px;
    }
    .input-wrap {
      position: relative;
    }
    .name-input {
      width: 100%;
      padding: 11px 12px;
      background: #14161c;
      border: 1px solid #232731;
      border-radius: 9px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 500;
      outline: none;
      transition: all 0.15s ease;
    }
    .name-input:focus {
      border-color: #3f4452;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
      background: #181b22;
    }
    .name-input::placeholder {
      color: #475569;
    }
    .input-hint {
      font-size: 11px;
      color: #64748b;
      margin-top: 6px;
    }

    /* Button */
    .btn-action {
      width: 100%;
      padding: 11px 14px;
      border-radius: 9px;
      border: none;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.15s ease;
      letter-spacing: -0.1px;
    }
    .btn-start {
      background: #ededee;
      color: #09090b;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }
    .btn-start:hover {
      background: #ffffff;
    }
    .btn-start:active {
      transform: scale(0.99);
    }

    .btn-stop {
      background: #ef4444;
      color: white;
      box-shadow: 0 2px 8px rgba(239, 68, 68, 0.3);
    }
    .btn-stop:hover {
      background: #dc2626;
    }

    /* Active Listening Card */
    .listening-box {
      display: none;
      background: #13151b;
      border: 1px solid #232731;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .listening-box.active {
      display: block;
    }
    .listening-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .listening-target {
      font-size: 13.5px;
      font-weight: 600;
      color: #f8fafc;
    }
    
    /* Live soundwave equalizer indicator */
    .wave-bars {
      display: flex;
      align-items: flex-end;
      gap: 2.5px;
      height: 14px;
    }
    .wave-bar {
      width: 2.5px;
      height: 100%;
      background: #10b981;
      border-radius: 2px;
      animation: wave 1.2s ease-in-out infinite;
    }
    .wave-bar:nth-child(1) { animation-delay: 0.0s; }
    .wave-bar:nth-child(2) { animation-delay: 0.2s; }
    .wave-bar:nth-child(3) { animation-delay: 0.4s; }
    .wave-bar:nth-child(4) { animation-delay: 0.1s; }
    @keyframes wave {
      0%, 100% { height: 4px; }
      50% { height: 14px; }
    }

    .listening-subtext {
      font-size: 11.5px;
      color: #64748b;
      margin-bottom: 12px;
    }

    /* Footer */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #1a1f2c;
      font-size: 11px;
    }
    .footer-tag {
      color: #475569;
      font-weight: 500;
    }
    .footer-link {
      background: none;
      border: none;
      color: #64748b;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.15s;
    }
    .footer-link:hover {
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5z"/></svg>
      </div>
      <span>Beckon</span>
    </div>
    <div class="status-pill">
      <span id="status-dot" class="status-dot"></span>
      <span id="status-text">Engine Ready</span>
    </div>
  </div>

  <div id="offline-banner" class="offline-banner">
    Engine is offline. Run <code>python daemon/main.py</code> in terminal to start.
  </div>

  <!-- Idle Input View -->
  <div id="idle-view">
    <div class="input-group">
      <label class="input-label" for="name-input">Keep an ear out for</label>
      <div class="input-wrap">
        <input 
          type="text" 
          id="name-input" 
          class="name-input" 
          placeholder="e.g. Alex, Alec" 
          value="Alex"
          autofocus
        />
      </div>
      <div class="input-hint">Enter your name or comma-separated aliases</div>
    </div>

    <button id="toggle-btn" class="btn-action btn-start">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
      <span>Start Listening</span>
    </button>
  </div>

  <!-- Active Listening View -->
  <div id="active-view" class="listening-box">
    <div class="listening-header">
      <div class="listening-target">
        Listening for <span id="active-names-display" style="color: #10b981;">"Alex"</span>
      </div>
      <div class="wave-bars">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>
    </div>
    <div class="listening-subtext">Active on current tab audio</div>
    <button id="stop-btn" class="btn-action btn-stop">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"></rect></svg>
      <span>Stop Listening</span>
    </button>
  </div>

  <div class="footer">
    <span class="footer-tag">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -1px; margin-right: 3px;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      On-device audio
    </span>
    <button id="settings-btn" class="footer-link">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -1px; margin-right: 3px;"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      Settings &amp; Test
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
